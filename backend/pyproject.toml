[project]
name = "stonefalcon"
version = "8.1.0"
description = "StoneFalcon: plataforma agêntica institucional (protótipo acadêmico UFSC / StoneLab)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "anthropic>=1.0",
  "python-dotenv>=1.0",
  "openpyxl>=3.1",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
