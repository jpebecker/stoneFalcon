name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  back:
    name: Back (pytest, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependências
        run: python -m pip install -r backend/requirements.txt pytest httpx
      - name: Testes (modo simulado, sem chave da API)
        working-directory: backend
        env:
          MODO_SIMULADO: "1"
        run: python -m pytest -q

  front:
    name: Front (tipos e compilação)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci --no-audit --no-fund
      - name: Checagem de tipos e compilação de produção
        run: npm --prefix frontend run build

  extensao:
    name: Extensão (manifesto)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Manifesto válido e arquivos citados existem
        run: python scripts/verifica_extensao.py

  versao:
    name: Consistência da versão
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Extensão, API e front contam o mesmo número
        run: python scripts/verifica_versao.py
